apply plugin: 'com.android.application'

// ── Release signing ──────────────────────────────────────────────────────────
// Credentials come from android/keystore.properties (gitignored) or, for CI,
// from environment variables. Neither the keystore nor its passwords belong in
// this repository. See android/RELEASE_SIGNING.md.
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

def signingStoreFile = keystoreProperties['storeFile'] ?: System.getenv('MH_KEYSTORE_FILE')
def signingStorePassword = keystoreProperties['storePassword'] ?: System.getenv('MH_KEYSTORE_PASSWORD')
def signingKeyAlias = keystoreProperties['keyAlias'] ?: System.getenv('MH_KEY_ALIAS')
def signingKeyPassword = keystoreProperties['keyPassword'] ?: System.getenv('MH_KEY_PASSWORD')
def hasSigningConfig = signingStoreFile && signingStorePassword && signingKeyAlias && signingKeyPassword

android {
    namespace = "com.millionaireblueprint.memoryhoops"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.millionaireblueprint.memoryhoops"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Play rejects an upload whose versionCode it has seen before, so CI can
        // override these without editing the file.
        versionCode = (System.getenv('MH_VERSION_CODE') ?: '1').toInteger()
        versionName = System.getenv('MH_VERSION_NAME') ?: '1.0'
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasSigningConfig) {
            release {
                storeFile file(signingStoreFile)
                storePassword signingStorePassword
                keyAlias signingKeyAlias
                keyPassword signingKeyPassword
                // Both schemes: v1 for API 24-ish devices, v2+ for modern ones.
                enableV1Signing true
                enableV2Signing true
            }
        }
    }
    buildTypes {
        release {
            if (hasSigningConfig) {
                signingConfig signingConfigs.release
            } else {
                logger.lifecycle(
                    '\n[memory-hoops] No signing credentials found — the release build will be UNSIGNED ' +
                    'and Play will reject it.\n' +
                    '               Create android/keystore.properties (see android/RELEASE_SIGNING.md) ' +
                    'or set MH_KEYSTORE_FILE / MH_KEYSTORE_PASSWORD / MH_KEY_ALIAS / MH_KEY_PASSWORD.\n'
                )
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
