    <style>
      /* Remove 300ms tap delay and blue flash on all interactive elements */
      *, *::before, *::after {
        -webkit-tap-highlight-color: transparent;
        touch-action: pan-x pan-y;
      }
      button, [role="button"] {
        touch-action: manipulation;
      }
      html, body, #root {
        margin: 0;
        padding: 0;
        overflow: hidden;
        width: 100%;
        height: 100%;
        /* Prevent iOS rubber-band scroll */
        overscroll-behavior: none;
      }
    </style>
